<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="white"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#111"/>
    </marker>
    <style>
      .t{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:700;fill:#111;font-size:22px}
      .title{font-size:34px}
      .b{fill:#f7f7f7;stroke:#111;stroke-width:2}
      .a{fill:#eceff7;stroke:#111;stroke-width:2}
      .line{stroke:#111;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <text x="40" y="60" class="t title">FIGURE 3 — AUTOMATED GOLD GENERATION</text>

  <rect class="b" x="90" y="360" rx="18" ry="18" width="250" height="110"/>
  <text class="t" x="215" y="420" text-anchor="middle">INPUT:</text>
  <text class="t" x="215" y="448" text-anchor="middle">rag_chunks.jsonl</text>

  <rect class="a" x="390" y="300" rx="18" ry="18" width="320" height="120"/>
