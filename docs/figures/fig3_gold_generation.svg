  <text class="t" x="550" y="385" text-anchor="middle">WEAK_LABEL / TASK MIX</text>

  <rect class="a" x="390" y="500" rx="18" ry="18" width="320" height="120"/>
  <text class="t" x="550" y="555" text-anchor="middle">MUST-REFUSE</text>
  <text class="t" x="550" y="585" text-anchor="middle">INJECTION (15%)</text>

  <rect class="a" x="780" y="360" rx="18" ry="18" width="350" height="110"/>
  <text class="t" x="955" y="420" text-anchor="middle">TEMPLATE-BASED</text>
  <text class="t" x="955" y="448" text-anchor="middle">QUESTION GENERATION</text>

  <rect class="b" x="1200" y="320" rx="18" ry="18" width="320" height="140"/>
  <text class="t" x="1360" y="380" text-anchor="middle">OUTPUT:</text>
  <text class="t" x="1360" y="410" text-anchor="middle">eval/gold.jsonl</text>

  <rect class="b" x="1200" y="510" rx="18" ry="18" width="320" height="110"/>
  <text class="t" x="1360" y="570" text-anchor="middle">MANIFEST METADATA</text>

  <path class="line" d="M340 415 L390 360"/>
  <path class="line" d="M340 415 L390 560"/>
  <path class="line" d="M710 360 L780 415"/>
  <path class="line" d="M710 560 L780 415"/>
  <path class="line" d="M1130 415 L1200 390"/>
  <path class="line" d="M1130 430 L1200 560"/>
</svg>
